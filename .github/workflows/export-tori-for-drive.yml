name: Export Tori source MP4s to private artifact

on:
  push:
    branches:
      - ops/tori-drive-export-20261119

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Git LFS media
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - name: Verify expected MP4 content hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path("assets/source/tori")
          manifest=json.loads((root/"manifest.json").read_text())
          assert len(manifest["files"]) == 5
          for item in manifest["files"]:
              f=root/item["file"]
              b=f.read_bytes()
              assert len(b)==item["bytes"], (f, len(b), item["bytes"])
              assert hashlib.sha256(b).hexdigest()==item["sha256"], f
              assert b"ftyp" in b[:32], f
              print(f"VERIFIED {f.name}: {len(b)} bytes")
          PY
      - name: Export verified MP4 files (short retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tori-mp4-for-drive
          path: |
            assets/source/tori/*.mp4
            assets/source/tori/manifest.json
            assets/source/tori/README.md
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
